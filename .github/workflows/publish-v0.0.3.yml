name: Publish v0.0.3 Pre-release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.0.3.yml'

permissions:
  contents: write

concurrency:
  group: publish-v0.0.3-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Rebuild, validate and publish v0.0.3
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.0.3

    steps:
      - name: Checkout publication commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Resolve and validate release metadata
        id: meta
        shell: pwsh
        run: |
          $appProject = "src\Zlet.FolderConverter.App\Zlet.FolderConverter.App.csproj"

          function Get-ProjectProperty([string]$Name) {
            $value = (& dotnet msbuild $appProject -nologo "-getProperty:$Name" |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Select-Object -Last 1).Trim()
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "$Name is empty."
            }
            return $value
          }

          $version = Get-ProjectProperty "ZletProductVersion"
          if ($version -ne "0.0.3") {
            throw "Expected ZletProductVersion 0.0.3, got $version."
          }

          $productName = Get-ProjectProperty "ZletProductName"
          $executableName = Get-ProjectProperty "ZletExecutableName"
          $portablePackageName = Get-ProjectProperty "ZletPortablePackageName"
          $notes = "docs\RELEASE_NOTES_v0.0.3.md"
          $installer = "$executableName-v$version-Setup-win-x64.exe"
          $portable = "$portablePackageName.zip"

          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes file is missing: $notes"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "product_name=$productName" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "portable=$portable" >> $env:GITHUB_OUTPUT

      - name: Remove stale draft only and guard published release
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to list releases."
          }

          $releases = $releasesJson | ConvertFrom-Json
          $matches = @($releases | Where-Object { $_.tag_name -eq $tag })

          if ($matches.Count -gt 1) {
            throw "Expected at most one release with tag $tag, found $($matches.Count)."
          }

          if ($matches.Count -eq 1) {
            $release = $matches[0]
            if (-not $release.draft) {
              throw "Release $tag is already published; refusing to replace or mutate it."
            }
            if (-not $release.prerelease) {
              throw "Existing $tag draft is not marked as pre-release; refusing to replace it."
            }

            Write-Output "Deleting stale draft release $tag (id $($release.id)) before rebuilding."
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to delete stale draft release $tag."
            }
          }

          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" *> $null
          $tagExit = $LASTEXITCODE
          if ($tagExit -eq 0) {
            Write-Output "Deleting stale tag ref $tag."
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to delete stale tag ref $tag."
            }
          }

          $recheck = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if (@($recheck | Where-Object { $_.tag_name -eq $tag }).Count -ne 0) {
            throw "Release $tag still exists after stale-draft cleanup."
          }

      - name: Restore
        run: dotnet restore FolderConverter.sln

      - name: Build Release
        run: dotnet build FolderConverter.sln -c Release --no-restore

      - name: Test Release
        run: dotnet test FolderConverter.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Restore win-x64 runtime packs for packaging
        shell: pwsh
        run: |
          dotnet restore src\Zlet.FolderConverter.App\Zlet.FolderConverter.App.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) {
            throw "App win-x64 runtime restore failed."
          }

          dotnet restore src\Zlet.FolderConverter.OfficeWorker\Zlet.FolderConverter.OfficeWorker.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) {
            throw "OfficeWorker win-x64 runtime restore failed."
          }

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $knownPaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )

          $hasCompiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or
            ($knownPaths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })

          if (-not $hasCompiler) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup installation failed."
            }
          }

      - name: Build installer and portable package
        shell: pwsh
        run: |
          .\scripts\build-installer.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Release packaging failed."
          }

      - name: Validate local packages and calculate SHA-256
        id: package
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "artifacts\installer\win-x64\${{ steps.meta.outputs.installer }}"
          $portable = Join-Path $PWD "artifacts\portable\win-x64\${{ steps.meta.outputs.portable }}"
          $checksums = Join-Path $PWD "artifacts\SHA256SUMS.txt"

          foreach ($path in @($installer, $portable)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected release file is missing: $path"
            }
            if ((Get-Item -LiteralPath $path).Length -le 0) {
              throw "Release file is empty: $path"
            }
          }

          $installerHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $portableHash = (Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash.ToLowerInvariant()

          @(
            "$installerHash  $([System.IO.Path]::GetFileName($installer))",
            "$portableHash  $([System.IO.Path]::GetFileName($portable))"
          ) | Set-Content -LiteralPath $checksums -Encoding ascii

          "installer_path=$installer" >> $env:GITHUB_OUTPUT
          "portable_path=$portable" >> $env:GITHUB_OUTPUT
          "checksums_path=$checksums" >> $env:GITHUB_OUTPUT
          "installer_hash=$installerHash" >> $env:GITHUB_OUTPUT
          "portable_hash=$portableHash" >> $env:GITHUB_OUTPUT

      - name: Create fresh Draft Pre-release
        id: create
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $title = "${{ steps.meta.outputs.product_name }} $tag"

          gh release create $tag `
            "${{ steps.package.outputs.installer_path }}" `
            "${{ steps.package.outputs.portable_path }}" `
            "${{ steps.package.outputs.checksums_path }}" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $title `
            --notes-file "${{ steps.meta.outputs.notes }}" `
            --draft `
            --prerelease

          if ($LASTEXITCODE -ne 0) {
            throw "Fresh v0.0.3 draft creation or asset upload failed."
          }

      - name: Validate exact draft and uploaded assets
        id: validate
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $expectedTitle = "${{ steps.meta.outputs.product_name }} $tag"
          $releases = (gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100") | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read release after creation."
          }

          $matches = @($releases | Where-Object { $_.tag_name -eq $tag })
          if ($matches.Count -ne 1) {
            throw "Expected exactly one draft release with tag $tag, found $($matches.Count)."
          }

          $release = $matches[0]
          if (-not $release.draft) { throw "$tag is not a draft before publication." }
          if (-not $release.prerelease) { throw "$tag lost pre-release status before publication." }
          if ($release.target_commitish -ne $env:GITHUB_SHA) {
            throw "Unexpected draft target: $($release.target_commitish); expected $env:GITHUB_SHA."
          }
          if ($release.name -ne $expectedTitle) {
            throw "Unexpected release title: $($release.name)"
          }

          $assets = @($release.assets)
          if ($assets.Count -ne 3) {
            throw "Expected exactly 3 release assets, found $($assets.Count)."
          }

          function Validate-Asset([string]$Name, [string]$ExpectedHash) {
            $matching = @($assets | Where-Object { $_.name -eq $Name })
            if ($matching.Count -ne 1) {
              throw "Expected exactly one asset named $Name, found $($matching.Count)."
            }
            $asset = $matching[0]
            if ([int64]$asset.size -le 0) {
              throw "Release asset $Name is empty."
            }
            if (-not [string]::IsNullOrWhiteSpace($ExpectedHash)) {
              $expectedDigest = "sha256:$ExpectedHash"
              if ($asset.digest -ne $expectedDigest) {
                throw "Unexpected digest for $Name: $($asset.digest); expected $expectedDigest."
              }
            }
          }

          Validate-Asset "${{ steps.meta.outputs.installer }}" "${{ steps.package.outputs.installer_hash }}"
          Validate-Asset "${{ steps.meta.outputs.portable }}" "${{ steps.package.outputs.portable_hash }}"
          Validate-Asset "SHA256SUMS.txt" ""

          "release_id=$($release.id)" >> $env:GITHUB_OUTPUT

      - name: Publish verified pre-release
        shell: pwsh
        run: |
          $releaseId = "${{ steps.validate.outputs.release_id }}"
          $published = gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" -F draft=false -F prerelease=true | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish verified v0.0.3 pre-release."
          }

          if ($published.draft) { throw "Release is still a draft after publication." }
          if (-not $published.prerelease) { throw "Release lost pre-release status after publication." }
          if ($published.tag_name -ne $env:RELEASE_TAG) { throw "Published tag changed unexpectedly." }
          if ($published.target_commitish -ne $env:GITHUB_SHA) {
            throw "Published release target changed unexpectedly: $($published.target_commitish)"
          }
          if ([string]::IsNullOrWhiteSpace($published.published_at)) {
            throw "published_at is empty after publication."
          }

          $tagRef = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Published tag ref is missing."
          }
          if ($tagRef.object.sha -ne $env:GITHUB_SHA) {
            throw "Published tag points to $($tagRef.object.sha), expected $env:GITHUB_SHA."
          }

          @(
            "## Published v0.0.3 PRE-ALPHA",
            "- Target commit: $env:GITHUB_SHA",
            "- Status: published pre-release",
            "- Installer: ${{ steps.meta.outputs.installer }}",
            "- Installer SHA-256: ${{ steps.package.outputs.installer_hash }}",
            "- Portable: ${{ steps.meta.outputs.portable }}",
            "- Portable SHA-256: ${{ steps.package.outputs.portable_hash }}",
            "- Release URL: $($published.html_url)",
            "- Full clean-machine / real Microsoft Office integration QA was not run by this hosted workflow."
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Remove local packaging files
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "artifacts") {
            Remove-Item -LiteralPath "artifacts" -Recurse -Force
          }
